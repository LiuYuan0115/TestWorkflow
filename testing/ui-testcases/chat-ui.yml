cases:
  - id: UI-CHAT-001
    title: 发送问题后 AI 返回纯文本消息正常渲染
    priority: P0
    platform: desktop
    source_testcase: CU-001
    preconditions:
      - 已登录并进入聊天界面
      - 网络连接正常
    steps:
      - step: 1
        action: 在页面底部的消息输入框中输入"你好"
      - step: 2
        action: 点击输入框右侧的蓝色发送按钮
      - step: 3
        action: 等待 AI 回复气泡出现在对话区
    expected:
      - 对话区出现 AI 回复气泡
      - 回复文本完整显示，无乱码
      - 用户消息和 AI 消息分区排列
    tags:
      - smoke
      - chat
    metadata:
      automation_note: 等待时间视网络和模型响应速度调整
  - id: UI-CHAT-002
    title: AI 返回含代码块的消息正确渲染
    priority: P0
    platform: desktop
    source_testcase: CU-002
    preconditions:
      - 已登录并进入聊天界面
    steps:
      - step: 1
        action: 在页面底部的消息输入框中输入"写一段 Python hello world 代码"
      - step: 2
        action: 点击输入框右侧的蓝色发送按钮
      - step: 3
        action: 等待包含代码块的 AI 回复出现在对话区
    expected:
      - AI 回复中代码块以等宽字体和语法高亮渲染
      - 代码块右上角显示复制按钮
      - 代码块外文字按正常文本排版
    tags:
      - smoke
      - chat
    metadata:
      automation_note: ""
  - id: UI-CHAT-003
    title: 流式输出时消息逐字逐段显示
    priority: P0
    platform: desktop
    source_testcase: CU-003
    preconditions:
      - 已登录并进入聊天界面
    steps:
      - step: 1
        action: 在页面底部的消息输入框中输入"详细解释量化交易的原理"
      - step: 2
        action: 点击输入框右侧的蓝色发送按钮
      - step: 3
        action: 等待 AI 回复区域开始出现流式文本
    expected:
      - AI 回复区域文本逐步出现
      - 输出过程中显示加载指示器或闪烁光标
      - 输出完成后加载指示器消失
    tags:
      - smoke
      - chat
    metadata:
      automation_note: 流式效果需在输出过程中观察
  - id: UI-CHAT-004
