      - smoke
      - chat
    metadata:
      automation_note: ""
  - id: UI-CHAT-005
    title: AI 流式输出完成后回复记录保留在对话中
    priority: P0
    platform: desktop
    source_testcase: CU-005
    preconditions:
      - 已登录并进入聊天界面
      - 网络连接正常
    steps:
      - step: 1
        action: 在页面底部的消息输入框中输入"你好"
      - step: 2
        action: 点击输入框右侧的蓝色发送按钮
      - step: 3
        action: 等待 AI 流式输出完成，加载指示器消失
      - step: 4
        action: 在页面中央的对话消息区域向上滚动
      - step: 5
        action: 在页面中央的对话消息区域向下滚动回到底部
    expected:
      - AI 回复完整保留在对话区，未消失
      - 用户提问也保留在对话区
      - 滚动后所有消息仍然存在
    tags:
      - smoke
      - chat
    metadata:
      automation_note: ""
  - id: UI-CHAT-006
    title: 连续多轮对话后所有消息记录均保留
    priority: P0
    platform: desktop
    source_testcase: CU-006
    preconditions:
      - 已登录并进入聊天界面
    steps:
      - step: 1
        action: 在页面底部的消息输入框中输入"第一个问题"
      - step: 2
        action: 点击输入框右侧的蓝色发送按钮
      - step: 3
        action: 等待第一条 AI 回复完成显示在对话区
      - step: 4
        action: 在页面底部的消息输入框中输入"第二个问题"
      - step: 5
        action: 点击输入框右侧的蓝色发送按钮
      - step: 6
        action: 等待第二条 AI 回复完成显示在对话区
      - step: 7
        action: 在页面中央的对话消息区域向上滚动到顶部
    expected:
      - 对话区包含 2 轮对话共 4 条消息
      - 消息顺序正确，无缺失
    tags:
      - smoke
      - chat
    metadata:
      automation_note: 简化为2轮验证，避免超时
